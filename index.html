<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scalable Vertical To-Do List</title>
  <style>
    :root {
      --header-bg: #c6def5;
      --body-bg: #ebf3fc;
      --accent-bg: #33332d;
      --star-color: #f59e0b;
      --text-main: #2c353d;
      --text-sub: #7a8694;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
      font-family: Georgia, "Times New Roman", Times, serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 기준이 되는 오리지널 크기 (240px × 340px) */
    .scaler-wrapper {
      width: 240px;
      height: 340px;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
    }

    .todo-widget {
      position: relative;
      width: 240px;
      height: 340px;
      background-color: var(--body-bg);
      border-radius: 0px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* 상단 헤더 */
    .todo-header {
      background-color: var(--header-bg);
      height: 42px;
      padding: 0 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .todo-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .task-count {
      font-size: 11.5px;
      color: var(--text-sub);
      font-family: sans-serif;
    }

    /* 본문 영역 */
    .todo-body {
      flex: 1;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .todo-input-box {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .todo-input {
      flex: 1;
      height: 28px;
      padding: 0 8px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 0px;
      background: #ffffff;
      font-size: 12px;
      color: var(--text-main);
      outline: none;
    }

    .todo-input:focus {
      border-color: var(--accent-bg);
    }

    .add-btn {
      width: 28px;
      height: 28px;
      background-color: var(--accent-bg);
      color: #ffffff;
      border: none;
      border-radius: 0px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 할 일 목록 스크롤 영역 */
    .todo-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }

    .todo-list::-webkit-scrollbar {
      width: 3px;
    }
    .todo-list::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.65);
      padding: 6px 8px;
      font-size: 12px;
      color: var(--text-main);
      border-radius: 0px;
      flex-shrink: 0;
    }

    .todo-item.important {
      background: rgba(255, 255, 255, 0.95);
      border-left: 3px solid var(--star-color);
      font-weight: 700;
    }

    .todo-item.completed span.todo-text {
      text-decoration: line-through;
      color: var(--text-sub);
      font-weight: normal;
    }

    .todo-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .todo-checkbox {
      cursor: pointer;
      accent-color: var(--accent-bg);
    }

    .todo-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .todo-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .star-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #d1d5db;
      padding: 0 2px;
    }
    .star-btn.active {
      color: var(--star-color);
    }

    .delete-btn {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
    }
    .delete-btn:hover {
      color: #ff5a5f;
    }

    /* 팔레트 버튼 */
    .theme-toggle-btn {
      position: absolute;
      bottom: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      background-color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.1);
      cursor: pointer;
      font-size: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .todo-widget:hover .theme-toggle-btn {
      opacity: 1;
    }

    /* 색상 설정 패널 */
    .theme-panel {
      position: absolute;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.98);
      padding: 16px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 10;
    }

    .theme-panel.active {
      display: flex;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      color: #222;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #666;
    }

    .color-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      color: #444;
    }

    .color-row input[type="color"] {
      width: 32px;
      height: 20px;
      border: 1px solid #ddd;
      padding: 0;
      background: none;
      cursor: pointer;
    }

    .preset-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .preset-btn {
      width: 18px;
      height: 18px;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    .reset-btn {
      width: 100%;
      padding: 5px;
      background-color: #f3f4f6;
      border: 1px solid #d1d5db;
      font-size: 11px;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="scaler-wrapper" id="scalerWrapper">
    <div class="todo-widget">
      <div class="todo-header">
        <div class="todo-title">To do</div>
        <div class="task-count" id="taskCount">0/0 done</div>
      </div>

      <div class="todo-body">
        <div class="todo-input-box">
          <input type="text" class="todo-input" id="todoInput" placeholder="할 일을 입력하세요..." autocomplete="off">
          <button class="add-btn" id="addBtn">+</button>
        </div>
        <div class="todo-list" id="todoList"></div>
      </div>

      <button class="theme-toggle-btn" id="openThemeBtn" title="색상 설정">🎨</button>

      <div class="theme-panel" id="themePanel">
        <div class="panel-header">
          <span>To do 색상 설정</span>
          <button class="close-btn" id="closeThemeBtn">&times;</button>
        </div>
        <div class="color-row">
          <label for="headerColor">헤더 색상</label>
          <input type="color" id="headerColor" value="#c6def5">
        </div>

          <input type="color" id="bodyColor" value="#ebf3fc">
        </div>
        <div class="color-row">
          <label for="accentColor">기본 강조색</label>
          <input type="color" id="accentColor" value="#33332d">
        </div>
        <div class="color-row">
          <label for="starColor">중요 별표 색상</label>
          <input type="color" id="starColor" value="#f59e0b">
        </div>
        <div class="preset-row">
          <button class="preset-btn" style="background:#c6def5" data-h="#c6def5" data-b="#ebf3fc" data-a="#33332d" data-s="#f59e0b"></button>
          <button class="preset-btn" style="background:#f5d0d6" data-h="#f5d0d6" data-b="#fdf2f4" data-a="#8a3b48" data-s="#e11d48"></button>
          <button class="preset-btn" style="background:#cde0d3" data-h="#cde0d3" data-b="#f2f7f4" data-a="#385443" data-s="#059669"></button>
          <button class="preset-btn" style="background:#e6dcc8" data-h="#e6dcc8" data-b="#f8f5ef" data-a="#5c4d3c" data-s="#d97706"></button>
          <button class="preset-btn" style="background:#d9d9d9"
